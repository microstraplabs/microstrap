  <g fill="none" stroke-linecap="round">
    <path d="M280,104 C262,98 244,92 226,82" stroke="#1F3D14" stroke-width="8"/>
    <path d="M280,104 C262,98 244,92 226,82" stroke="#4E8F2F" stroke-width="4"/>
    <path d="M304,108 C318,106 330,102 342,94" stroke="#1F3D14" stroke-width="7"/>
    <path d="M304,108 C318,106 330,102 342,94" stroke="#4E8F2F" stroke-width="3.5"/>
  </g>

  <!-- Leaves -->
  <g stroke="#1F3D14" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(226 82) rotate(-64) scale(0.9)">
      <use xlink:href="#pumpkin-leaf" href="#pumpkin-leaf" fill="url(#leaf-g)"/>
      <path d="M0,-6L0,-94M0,-8L-30,-64M0,-8L30,-64M0,-6L-49,-27M0,-6L49,-27" fill="none" stroke="#1F3D14" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g transform="translate(342 94) rotate(60) scale(0.62)">
