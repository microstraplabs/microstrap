  <!-- Curly tendril -->
  <path d="M304,84 C336,84 364,62 350,42 C341,30 325,38 330,50 C334,58 345,54 343,47" fill="none" stroke="#1F3D14" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M304,84 C336,84 364,62 350,42 C341,30 325,38 330,50 C334,58 345,54 343,47" fill="none" stroke="#5E9A32" stroke-width="3" stroke-linecap="round"/>

