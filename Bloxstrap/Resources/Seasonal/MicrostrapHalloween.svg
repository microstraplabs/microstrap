<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="microstrap-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA733"/>
      <stop offset="52%" stop-color="#FF6A2B"/>
      <stop offset="100%" stop-color="#F0282E"/>
    </linearGradient>
    <linearGradient id="leaf-g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F6B22"/>
      <stop offset="100%" stop-color="#6FB33F"/>
    </linearGradient>
    <linearGradient id="stem-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F6B22"/>
      <stop offset="55%" stop-color="#6FA337"/>
      <stop offset="100%" stop-color="#3A611F"/>
    </linearGradient>
    <mask id="microstrap-cut">
      <rect width="512" height="512" fill="black"/>
      <g fill="white" transform="rotate(9 256 256)">
        <rect x="51" y="51" width="190" height="190" rx="34"/>
        <rect x="271" y="51" width="190" height="190" rx="34"/>
        <rect x="51" y="271" width="190" height="190" rx="34"/>
        <rect x="271" y="271" width="190" height="190" rx="34"/>
      </g>
      <rect x="212" y="212" width="88" height="88" rx="18" fill="black" transform="rotate(9 256 256)"/>
    </mask>
    <clipPath id="tile-tl"><rect x="51" y="51" width="190" height="190" rx="34"/></clipPath>
    <clipPath id="tile-br"><rect x="271" y="271" width="190" height="190" rx="34"/></clipPath>
    <path id="pumpkin-leaf" d="M0,-6 Q-22,8 -46,-2 Q-58,-14 -54,-30 Q-40,-30 -28,-36 Q-40,-52 -34,-70 Q-20,-62 -12,-60 Q-14,-82 0,-100 Q14,-82 12,-60 Q20,-62 34,-70 Q40,-52 28,-36 Q40,-30 54,-30 Q58,-14 46,-2 Q22,8 0,-6Z"/>
