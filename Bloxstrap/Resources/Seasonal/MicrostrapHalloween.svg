  </g>

  <!-- Pumpkin stem, sitting in the notch between the two top tiles (leans with the 9deg tilt) -->
  <g stroke="#1F3D14" stroke-width="3.5" stroke-linejoin="round">
    <path d="M262,128 C272,112 274,94 275,80 C276,70 280,64 288,62 L304,66 C307,76 304,90 301,102 C299,114 304,122 316,128 Z" fill="url(#stem-g)"/>
