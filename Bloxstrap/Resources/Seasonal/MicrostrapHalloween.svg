        <path d="M427.0,461.0Q433.0,455.4 429.6,448.0Q437.3,445.1 437.0,437.0Q445.1,437.3 448.0,429.6Q455.4,433.0 461.0,427.0M393.0,461.0Q405.0,449.9 398.2,435.0Q413.5,429.3 412.9,412.9Q429.3,413.5 435.0,398.2Q449.9,405.0 461.0,393.0M359.0,461.0Q377.0,444.3 366.8,422.0Q389.8,413.4 388.9,388.9Q413.4,389.8 422.0,366.8Q444.3,377.0 461.0,359.0M325.0,461.0Q349.0,438.7 335.4,409.0Q366.0,397.5 364.8,364.8Q397.5,366.0 409.0,335.4Q438.7,349.0 461.0,325.0M291.0,461.0Q320.9,433.1 303.9,395.9Q342.3,381.7 340.8,340.8Q381.7,342.3 395.9,303.9Q433.1,320.9 461.0,291.0" stroke-width="1.8"/>
      </g>
