<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microstrap for Roblox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="brand">Microstrap</div><div class="subhead">ROBLOX CUSTOMIZATION</div></header>
  <label class="row"><span><b>Orange → red theme</b><small>Restyle Roblox navigation and controls</small></span><input type="checkbox" id="enabled"></label>
  <label class="row"><span><b>Compact game cards</b><small>Use tighter card corners</small></span><input type="checkbox" id="compactCards"></label>
  <label class="row"><span><b>Hide promotions</b><small>Hide upsell panels</small></span><input type="checkbox" id="hidePromotions"></label>
  <div class="colors"><label>Orange<input type="color" id="accentStart"></label><label>Red<input type="color" id="accentEnd"></label></div>
  <div class="footer">Settings apply on roblox.com</div>
  <script src="popup.js"></script>
</body>
</html>
