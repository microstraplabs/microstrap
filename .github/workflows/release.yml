name: Release Microstrap

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build embedded Python runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'python-installer.exe'
          $runtime = Join-Path $env:RUNNER_TEMP 'microstrap-python'
          Invoke-WebRequest https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe -OutFile $installer
          Start-Process $installer -Wait -ArgumentList @('/quiet', 'InstallAllUsers=0', "TargetDir=$runtime", 'Include_launcher=0', 'Include_test=0', 'PrependPath=0')
          Compress-Archive -Path (Join-Path $runtime '*') -DestinationPath .\Bloxstrap\Resources\MicrostrapOverlayRuntime.zip

      - name: Publish Windows executable
        run: dotnet publish Bloxstrap/Bloxstrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --nologo

      - name: Prepare release files
        shell: pwsh
        run: |
          Copy-Item Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/Microstrap.exe Microstrap.exe
          Compress-Archive -Path Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/* -DestinationPath Microstrap-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} Microstrap.exe Microstrap-${{ github.ref_name }}-win-x64.zip --target ${{ github.sha }} --title "Microstrap ${{ github.ref_name }}" --generate-notes
