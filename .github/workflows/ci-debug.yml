name: CI (Debug)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Build embedded Python runtime
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'python-installer.exe'
        $runtime = Join-Path $env:RUNNER_TEMP 'microstrap-python'
        Invoke-WebRequest https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe -OutFile $installer
        Start-Process $installer -Wait -ArgumentList @('/quiet', 'InstallAllUsers=0', "TargetDir=$runtime", 'Include_launcher=0', 'Include_test=0', 'PrependPath=0')
        Compress-Archive -Path (Join-Path $runtime '*') -DestinationPath .\Bloxstrap\Resources\MicrostrapOverlayRuntime.zip

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Debug --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Bloxstrap (Debug) (${{ github.sha }})
        path: .\Bloxstrap\bin\Debug\net6.0-windows\win-x64\publish\*